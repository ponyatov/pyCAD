[project]
name = "pycad"
description = "2D CAD for Electronics Design /Python/"
authors = [
    { name = "Dmitry Ponyatov", email = "<dponyatov@gmail.com>" },
    { name = "DeepSeek Chat" },
]
dynamic = ["version"]
readme = "README.md"
license = { text = "MIT" }

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

requires-python = ">= 3.11"
dependencies = ["ply >= 3.11"]

[project.urls]
Homepage = "https://github.com/ponyatov/pyCAD"
Source = "https://github.com/ponyatov/pyCAD/tree/seek"
Issues = "https://github.com/ponyatov/pyCAD/issues"

[project.optional-dependencies]
gui = [
    "PyQt6 >= 6.4", # need full-sized GUI for CAD with complex interface
    # "qt6ct",        # using dark system color theme
]
dev = [
    "autopep8 >= 2.0.1",
    # "pytest>=7.0",
    # "black>=22.0",
    # "mypy>=1.0",
    # "flake8>=5.0",
    # "sphinx>=6.0",     # Documentation
]
kicad = [
    "kicad-python>=0.3.0", # using KiCAD bindings
]
export = [
    "ezdxf>=0.18.1",        # DXF support
    "python-gerber>=0.1.0", # Gerber/Excellon
    "svgwrite>=1.4.0",      # SVG export
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycad*"]
